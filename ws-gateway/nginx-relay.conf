# Nginx reverse proxy for the realtime gateway.
# Install:  sudo cp nginx-relay.conf /etc/nginx/sites-available/relay.quickwebs.site
#           sudo ln -s /etc/nginx/sites-available/relay.quickwebs.site /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# TLS:      sudo certbot --nginx -d relay.quickwebs.site

server {
    listen 80;
    listen [::]:80;
    server_name relay.quickwebs.site;

    # Certbot will rewrite this to redirect + add the 443 block below.
    location / {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/proxy_params;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name relay.quickwebs.site;

    # Paths are filled in by certbot --nginx; shown here for reference.
    # ssl_certificate     /etc/letsencrypt/live/relay.quickwebs.site/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/relay.quickwebs.site/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3001;

        # --- Required for WebSockets ---
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # --- Standard headers ---
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived sockets: don't time out idle connections (heartbeat is
        # 25s/20s, but keep the proxy generous so only the app-level
        # heartbeat governs disconnects).
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }
}
